<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>balenciaga pride</title>
  <meta itemprop="name" content="balenciaga pride">
  <meta name="twitter:title" content="balenciaga pride">
  <meta property="og:title" content="balenciaga pride">
  <meta property="og:site_name" content="balenciaga pride">
  <meta name="description" content="AR pride shirt made with photoshop, premeire pro, and a-frame.">
  <meta itemprop="description" content="AR pride shirt made with photoshop, premeire pro, and a-frame.">
  <meta property="og:description" content="AR pride shirt made with photoshop, premeire pro, and a-frame.">
  <meta name="twitter:description" content="AR pride shirt made with photoshop, premeire pro, and a-frame.">
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.2.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>

  <meta property="og:image" content="https://evanmcarlson.github.io/balenciaga-pride/assets/demo.jpg">

  <meta name="apple-mobile-web-app-capable" content="yes"/>

</head>

<body>

  <script src="bundle.js"></script>

  <a-scene
    xrextras-gesture-detector
    landing-page
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement:true;"
    xrweb
    play-video
  >
    <a-assets>
      <video id="video" loop muted playsinline src="./assets/video-optimized.mp4"></video>
    </a-assets>

    <!-- 0 4 10 -->
    <a-camera
      position="0 2 2"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;"
    >
    </a-camera>

    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

    <a-light type="ambient" intensity="0.7"></a-light>

    <xrextras-named-image-target name="shirt">
      <a-plane
        id="videoEl"
        material="shader: chromakey; src: #video; color: 0 0 0; opacity: 0"
      ></a-plane>
    </xrextras-named-image-target>
  </a-scene>

</body>

</html>
